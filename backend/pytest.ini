[pytest]
testpaths = tests
# auto — щоб async-тести не треба було позначати вручну кожен. Без цього
# pytest мовчки рахує async-функцію пройденою, ніколи її не виконавши.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    smoke: б'є в справжній HTTP піднятого контейнера; пропускається без нього
