<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account activated</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
<div style="max-width: 480px; margin: 48px auto; background-color: #ffffff; border: 1px solid #e4e4e7; border-radius: 6px;">
  <div style="padding: 32px 40px 0;">
    <p style="margin: 0 0 28px; font-size: 12px; line-height: 1; letter-spacing: 2px; text-transform: uppercase; color: #a1a1aa; font-weight: 600;">
      LTS
    </p>
  </div>
  <div style="padding: 0 40px 36px;">
    <h1 style="margin: 0 0 16px; font-size: 20px; line-height: 1.3; color: #18181b; font-weight: 600;">
      Your account is now active
    </h1>
    <p style="margin: 0 0 20px; font-size: 15px; line-height: 1.6; color: #52525b;">
      The account for:
    </p>
    <p style="margin: 0 0 24px;">
      <span id="email" style="display: inline-block; font-family: Consolas, Menlo, monospace; font-size: 14px; color: #18181b; background-color: #f4f4f5; padding: 6px 12px; border-radius: 4px;">
        {{ email }}
      </span>
    </p>
    <p style="margin: 0 0 28px; font-size: 15px; line-height: 1.6; color: #52525b;">
      has been successfully activated. You can now log in and start using the platform.
    </p>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td style="border-radius: 4px; background-color: #18181b;">
          <a id="link" href="{{ login_link }}" style="display: inline-block; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 600; padding: 12px 28px;">
            Log in
          </a>
        </td>
      </tr>
    </table>
    <p style="margin: 32px 0 0; font-size: 13px; line-height: 1.6; color: #a1a1aa;">
      Questions? Reach out to our support team any time.
    </p>
  </div>
  <div style="padding: 20px 40px; border-top: 1px solid #e4e4e7;">
    <p style="margin: 0; font-size: 13px; color: #a1a1aa;">
      — The LTS team
    </p>
  </div>
</div>
</body>
</html>
