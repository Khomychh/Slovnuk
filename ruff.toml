# Набір правил навмисно вузький.
#
# `F` — це те, що вказує на справжню проблему: незужитий імпорт, невизначене
# імʼя, змінна, якій присвоїли значення й не скористались. `E4/E7/E9` —
# помилки імпортів і синтаксису. `I` — сортування імпортів, чисто механічне.
#
# Ширші набори (`E,W,UP,B,SIM,C4`) дають на цьому коді 700+ зауважень, з них
# 328 — просто довгі рядки. Лінтер, який червоний завжди, перестають читати, і
# тоді він не ловить нічого.

target-version = "py314"
line-length = 88

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# У `__init__.py` імпорт і є роботою: файл збирає публічний інтерфейс пакета.
# «Невикористаним» такий імпорт виглядає лише зсередини самого файлу.
"__init__.py" = ["F401"]

# Тут порядок імпортів значущий, а не косметичний: `accounts.py` робить
# `from app.database.models import Base`, тож `base` мусить бути імпортований
# першим. Відсортоване за абеткою `accounts` спливає нагору — і застосунок
# падає циклічним імпортом ще на старті.
"backend/app/database/models/__init__.py" = ["I001"]
