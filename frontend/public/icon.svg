<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Slovnuk">
  <!--
    «Сяйво над обрієм» — підпис-елемент застосунку в масштабі іконки.

    Це та сама стрічка, що стоїть над кнопкою «Вчити» й над краєм картки
    (`.aurora::before` у theme.css): рампа від холодного нового до золотого
    давно відомого. Іконка не вигадує собі окремої графіки — вона показує те,
    що людина бачить у застосунку щодня.

    Форма, а не серпанок. Полярне сяйво впізнають за силуетом завіси: різкий
    верхній край і хвилястий поділ, що розчиняється донизу. М'яка кольорова
    пляма без країв на 48 пікселях перетворюється на брудну цятку, а дуга з
    тонким ядром читається веселкою — це інше явище й інший знак.

    Смуг-стовпчиків тут більше немає. Вони були в мертвій палітрі: тло #14100D
    — тепла коричнева ніч зі старого оформлення, тоді як ніч застосунку
    (#070a14) холодна й синя, а самі смуги йшли по старій рампі, без індиго,
    бірюзи й зеленого. До того ж три смуги різної довжини вже означають вкладку
    «Прогрес», і на домашньому екрані іконка читалась графіком біржі.

    Подвійного дефіса в цих коментарях бути не може: XML його забороняє
    всередині коментаря, і файл із ним не парситься зовсім — браузер показує
    биту картинку замість іконки.

    Поле власне й непрозоре навмисно. Прозора іконка бере колір того, на чому
    лежить: на світлій панелі браузера темний малюнок зникає, на темній —
    світлий. Тут поле завжди своє, тож іконка виглядає однаково скрізь.
  -->
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d6bff"/>
      <stop offset="20%" stop-color="#3e9be8"/>
      <stop offset="40%" stop-color="#1fc8b4"/>
      <stop offset="60%" stop-color="#58d97c"/>
      <stop offset="80%" stop-color="#f0a73c"/>
      <stop offset="100%" stop-color="#ffd65c"/>
    </linearGradient>

    <!-- Згасання донизу. Верхня половина тримається щільною, і лише потім
         світло відпускає: рівномірний градієнт гасив би завісу одразу під
         краєм, і на малому розмірі від неї лишалась би сама риска. -->
    <!-- Зупинки лягають на криву `v^0.75`, якою згасає та сама завіса в
         растрових іконках: лінійне згасання гасить її вдвічі швидше, і поруч
         із PNG це видно як дві різні іконки. -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#fff" stop-opacity="0.91"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#fff" stop-opacity="0.51"/>
      <stop offset="92%" stop-color="#fff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- Боки завіси гаснуть, інакше вона впирається в рамку іконки. -->
    <linearGradient id="sides" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="10%" stop-color="#fff"/>
      <stop offset="90%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>

    <mask id="curtain">
      <!-- Силует: рівний верх, хвилястий поділ. -->
      <path d="M 0 132 H 512 V 300 C 448 344 400 268 336 302
               C 272 336 216 268 152 296 C 96 320 48 276 0 300 Z"
            fill="url(#fade)"/>
    </mask>

    <!-- Бічне згасання застосовується один раз, до обох шарів світла разом:
         їхні краї мусять гаснути однаково, а два окремі описи того самого
         згасання розійшлись би при першій же правці. -->
    <mask id="curtain-sides">
      <rect width="512" height="512" fill="url(#sides)"/>
    </mask>

    <!-- Світло, що зібралось над самою землею. Без нього небо і земля обидва
         майже чорні, край між ними не читається, і завіса висить у порожнечі.
         Кольорова риска по обрію тут не годиться — вона читалась би окремим
         предметом. -->
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.23"/>
    </linearGradient>
    <mask id="pool-mask">
      <rect y="298" width="512" height="90" fill="url(#pool)"/>
    </mask>

    <clipPath id="field">
      <rect width="512" height="512" rx="114"/>
    </clipPath>
  </defs>

  <g clip-path="url(#field)">
    <rect width="512" height="512" fill="#070a14"/>
    <g mask="url(#curtain-sides)">
      <rect width="512" height="512" fill="url(#aurora)" mask="url(#curtain)"/>
      <rect width="512" height="512" fill="url(#aurora)" mask="url(#pool-mask)"/>
    </g>
    <!-- Земля різким краєм: саме він робить із світла «сяйво НАД обрієм». -->
    <rect y="388" width="512" height="124" fill="#03050b"/>
  </g>
</svg>
