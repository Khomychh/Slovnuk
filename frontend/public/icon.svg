<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Slovnuk">
  <!--
    Ініціал застосунку гарнітурою Unbounded (ADR-0033), залитий стрічкою
    сяйва: той самий градієнт, що над кнопкою «Вчити» й по краю картки.

    Малюнок повторює icon-512.png точка в точку: контур узято з самого
    файла гарнітури на вазі 500, тобто рухати його руками тут не можна.

    Поле власне й непрозоре: прозора іконка бере колір того, на чому лежить,
    і на світлій панелі темна літера зникає.

    Подвійного дефіса в коментарях бути не може: XML його забороняє, і файл
    із ним не парситься зовсім.
  -->
  <defs>
    <linearGradient id="aurora" gradientUnits="userSpaceOnUse"
                    x1="111.96" y1="0" x2="400.04" y2="0">
      <stop offset="0" stop-color="#736bc9"/>
      <stop offset="0.33" stop-color="#2ea2e5"/>
      <stop offset="0.66" stop-color="#03d2ca"/>
      <stop offset="1" stop-color="#fed25f"/>
    </linearGradient>
    <clipPath id="field">
      <rect width="512" height="512" rx="114"/>
    </clipPath>
  </defs>

