# Server overlay. Applied on top of the base layer:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# It does exactly one thing: it exposes the frontend container to the external `web` network, where
# the server’s shared Caddy instance is located (deploy/).

services:
  frontend:
    networks:
      - slovnuk_network
      - web

networks:
  # Created once, outside this project:
  #     docker network create web
  web:
    external: true
