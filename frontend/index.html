<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover — щоб env(safe-area-inset-*) працювало під вирізом
         і жестовою смугою; застосунок ставиться на домашній екран. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Дорівнює --night у theme.css. Розійтись їм не можна: смуга статусу
         телефона стоїть упритул до застосунку, і різниця читається як шов. -->
    <meta name="theme-color" content="#070a14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Slovnuk" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Slovnuk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
